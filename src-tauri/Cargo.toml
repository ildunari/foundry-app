[package]
name = "foundry-app"
version = "0.1.0"
edition = "2021"

[lib]
name = "foundry_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "process", "io-util"] }
walkdir = "2"
dirs = "6"
portable-pty = "0.8"
notify = "7"
