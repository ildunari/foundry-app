<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="anvil-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A3A3A"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <linearGradient id="anvil-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A4A4A"/>
      <stop offset="100%" stop-color="#2E2E2E"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="1" x2="0.3" y2="0">
      <stop offset="0%" stop-color="#D15010"/>
      <stop offset="100%" stop-color="#F0882D"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="1" x2="0.5" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#D15010" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#D15010" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round-clip">
      <rect x="32" y="32" width="448" height="448" rx="90" ry="90"/>
    </clipPath>
  </defs>

  <!-- Background: rounded square for macOS icon shape -->
  <rect x="32" y="32" width="448" height="448" rx="90" ry="90" fill="#141414"/>

  <!-- Subtle radial glow behind the spark area -->
  <ellipse cx="256" cy="200" rx="120" ry="100" fill="url(#glow)" clip-path="url(#round-clip)"/>

  <!-- Anvil — stylized geometric form -->
  <!-- Anvil horn (left tapered extension) -->
  <path d="
    M 108 258
    Q 108 248, 118 244
    L 188 244
    L 188 272
    L 118 272
    Q 108 268, 108 258
  " fill="url(#anvil-face)"/>

  <!-- Anvil face (top working surface) — wide flat top -->
  <path d="
    M 180 232
    L 380 232
    Q 396 232, 400 240
    L 400 272
    Q 400 280, 396 284
    L 380 284
    L 180 284
    L 180 232
  " fill="url(#anvil-face)"/>

  <!-- Anvil body (middle narrowing section) -->
  <path d="
    M 210 284
    L 360 284
    L 340 320
    L 230 320
    Z
  " fill="url(#anvil-body)"/>

  <!-- Anvil base (wide bottom foot) -->
  <path d="
    M 190 320
    L 380 320
    Q 392 320, 394 332
    L 394 360
    Q 394 372, 382 372
    L 188 372
    Q 176 372, 176 360
    L 176 332
    Q 176 320, 190 320
  " fill="url(#anvil-body)"/>

  <!-- Grid lines on anvil face — subtle design system reference -->
  <line x1="240" y1="240" x2="240" y2="276" stroke="#5A5A5A" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="290" y1="240" x2="290" y2="276" stroke="#5A5A5A" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="340" y1="240" x2="340" y2="276" stroke="#5A5A5A" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="188" y1="258" x2="396" y2="258" stroke="#5A5A5A" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Highlight edge on anvil face top -->
  <line x1="184" y1="233" x2="396" y2="233" stroke="#666666" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Molten drop / spark — the signature accent element -->
  <!-- Main drop shape falling toward the anvil -->
  <path d="
    M 290 140
    Q 290 130, 296 126
    Q 310 108, 310 92
    Q 310 76, 296 68
    Q 306 64, 312 72
    Q 322 86, 322 100
    Q 322 118, 306 136
    Q 298 146, 290 140
  " fill="url(#spark)"/>

  <!-- Central large drop -->
  <ellipse cx="290" cy="168" rx="18" ry="22" fill="#D15010"/>
  <!-- Hot highlight on drop -->
  <ellipse cx="286" cy="162" rx="8" ry="10" fill="#F0882D" opacity="0.7"/>
  <!-- Bright core -->
  <ellipse cx="284" cy="160" rx="4" ry="5" fill="#FFAA55" opacity="0.6"/>

  <!-- Small sparks / particles -->
  <circle cx="258" cy="188" r="4" fill="#D15010" opacity="0.8"/>
  <circle cx="244" cy="178" r="2.5" fill="#F0882D" opacity="0.6"/>
  <circle cx="316" cy="182" r="3" fill="#D15010" opacity="0.7"/>
  <circle cx="328" cy="172" r="2" fill="#F0882D" opacity="0.5"/>
  <circle cx="270" cy="198" r="2.5" fill="#D15010" opacity="0.5"/>

  <!-- Tiny rising spark trails -->
  <circle cx="302" cy="148" r="2" fill="#FFAA55" opacity="0.5"/>
  <circle cx="278" cy="144" r="1.5" fill="#F0882D" opacity="0.4"/>
</svg>